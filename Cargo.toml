[package]
name = "prime_radiant"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "primeradiant"
path = "src/bin/primeradiant.rs"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
sha2 = "0.10"
ulid = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"

axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "signal", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
getrandom = "0.3"
hmac = "0.12"
subtle = "2"
libc = "0.2"
candle-core = "0.11"
candle-nn = "0.11"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", features = ["metal"] }
candle-nn = { version = "0.11", features = ["metal"] }

[dev-dependencies]
tempfile = "3"
